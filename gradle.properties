org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Maven coordinates of the published library. The version is also the git tag.
GROUP=ai.terrabite
POM_ARTIFACT_ID=prismsdk
VERSION_NAME=0.1.0

# POM fields Maven Central validates. Read by com.vanniktech.maven.publish.
POM_NAME=Prism SDK
POM_DESCRIPTION=Background location tracking for Android apps.
POM_INCEPTION_YEAR=2026
POM_URL=https://github.com/terrabite-ai/prismsdk-android
POM_LICENSE_NAME=MIT License
POM_LICENSE_URL=https://opensource.org/licenses/MIT
POM_LICENSE_DIST=repo
POM_SCM_URL=https://github.com/terrabite-ai/prismsdk-android
POM_SCM_CONNECTION=scm:git:git://github.com/terrabite-ai/prismsdk-android.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://git@github.com/terrabite-ai/prismsdk-android.git
POM_DEVELOPER_ID=terrabite
POM_DEVELOPER_NAME=Terrabite AI
POM_DEVELOPER_EMAIL=support@terrabite.ai
POM_DEVELOPER_URL=https://terrabite.ai

# Where publishToMavenCentral uploads, and that a validated upload is released
# without a manual click in the portal.
SONATYPE_HOST=CENTRAL_PORTAL
SONATYPE_AUTOMATIC_RELEASE=true

# Signing is required by Central and skipped for publishToMavenLocal. The keys
# themselves live in the release machine's ~/.gradle/gradle.properties.
RELEASE_SIGNING_ENABLED=true
